# Shared source-import, map-build, release and database-test environment.
name: worldatlas
channels:
  - conda-forge
dependencies:
  - python=3.13.9
  - gdal=3.10.3
  - proj=9.6.0
  - pyproj=3.7.1
  - geos=3.13.1
  - postgresql=17.5
  - cmake=4.4.3
  - pip
  - pip:
      - numpy==2.5.4
      - scipy==1.18.1
      - pyarrow==21.0.0
      - shapely==2.2.0
      - numba==0.68.1
      - llvmlite==0.50.0
      - pyshp==3.1.8
      - osmium==4.3.2
      - boto3==1.43.126
      - botocore==1.43.127
      - psycopg[binary]==3.2.3
      - matplotlib==3.11.2
