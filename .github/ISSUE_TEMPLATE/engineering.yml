name: Engineering
description: Code, database, UI, infrastructure or geographic releases
labels: ["type:engineering"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Goal and scope
      description: Explain the concrete problem or bounded geography, time, attributes and source scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What evidence establishes completion? Keep actionable issues bounded by acceptance and ownership; use children for distinct deliverables, not PR-count exhaustion. Partial PRs keep the issue open.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources, evidence and existing work
      description: Link sources, contracts, preserved inputs or receipts. Never include credentials.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related issues
      description: Link parent or child issues and coordinate overlapping work before starting.
  - type: input
    id: raised
    attributes:
      label: Original raised date, if known
      description: America/Los_Angeles date; use unknown when earlier history does not establish it. GitHub records creation separately.
      placeholder: YYYY-MM-DD or unknown
  - type: textarea
    id: coordination
    attributes:
      label: Work-item readiness (triage)
      description: Before ready labeling, add a reviewed worldatlas-work:v1 scope block with max_prs (positive planning estimate, not a hard cap), depends_on and mode. History research is source-only until its complete published regional approval; geography evidence uses the separate geography form. See docs/WORKER_COORDINATION.md.
