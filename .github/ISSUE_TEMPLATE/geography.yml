name: Geography research
description: Sourced boundary, hierarchy, granularity or geographic-source evidence and proposals
labels: ["type:geography"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Exact reviewed geography and evidence scope
      description: List stable subject IDs, region/release pins and the source/geographic questions. Work packets do not create new geography.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Sourced acceptance and unresolved findings
      description: Keep ready work bounded by acceptance and ownership, not PR count. Engineering implements shared migrations/releases; research supplies evidence and bounded proposals.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources, retained evidence and dependencies
      description: Link inspected sources, original hashes, claims and related work. No credentials.
  - type: input
    id: raised
    attributes:
      label: Original raised date, if known
      description: America/Los_Angeles; keep unknown earlier dates unknown.
