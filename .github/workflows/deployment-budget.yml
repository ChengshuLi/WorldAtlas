name: Deployment package budget

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.profile.outputs.full }}
    steps:
      # Never execute the candidate classifier with the read-only API token.
      # Before the helper reaches trusted base, every event gets a full build.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: github.event_name == 'pull_request' || (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000')
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: trusted
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/classify-deployment-budget.mjs
            package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: profile
        name: Classify complete changed paths with trusted base code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if test -f trusted/scripts/classify-deployment-budget.mjs && node trusted/scripts/classify-deployment-budget.mjs; then
            :
          else
            echo 'full=true' >> "$GITHUB_OUTPUT"
            mkdir -p .cache
            echo '{"version":1,"full":true,"fallback":true,"reason":"Trusted classifier unavailable or failed"}' > .cache/deployment-budget-scope.json
          fi
      - name: Retain applicability decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-budget-scope
          path: .cache/deployment-budget-scope.json
          include-hidden-files: true
  package:
    needs: classify
    # A classifier timeout/failure cannot turn a required full check into a skip.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout complete package inputs
        if: needs.classify.outputs.full != 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout only Node budget unit inputs
        if: needs.classify.outputs.full == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/deployment-budget.mjs
            scripts/classify-deployment-budget.mjs
            test/deployment-budget.test.mjs
            test/deployment-budget-scope.test.mjs
            .github/workflows/deployment-budget.yml
            package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: ${{ needs.classify.outputs.full != 'false' && 'npm' || '' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: needs.classify.outputs.full != 'false'
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --no-audit --no-fund
        if: needs.classify.outputs.full != 'false'
      - run: python -m pip install -r requirements.txt
        if: needs.classify.outputs.full != 'false'
      - run: node --test test/deployment-budget.test.mjs test/deployment-budget-scope.test.mjs
      - name: Build and enforce archive/file reserves without publishing
        if: needs.classify.outputs.full != 'false'
        run: npm run build:hosted
      - name: Record package rebuild inapplicability
        if: needs.classify.outputs.full == 'false'
        run: echo 'Package rebuild inapplicable to explicit coordination/documentation/receipt paths; mandatory Node budget/archive unit tests passed. No current package size measurement is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact file and archive accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-budget
          path: .cache/deployment-budget.json
          include-hidden-files: true
          if-no-files-found: ignore
