name: Handoff lane scope

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

# Superseded heads cannot satisfy current-head evidence. These jobs are
# read-only: cancel duplicate downloads instead of spending shared quota.
concurrency:
  group: worldatlas-handoff-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted base code runs with the read-only token. Candidate code is never executed here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate actual evidence bytes with trusted code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f scripts/check-pr-evidence.mjs; then
            node scripts/check-pr-evidence.mjs
          else
            echo '{"status":"bootstrap-not-checked","limits":["Evidence checker not yet present on trusted base"]}' > evidence-check.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: evidence-check.json
          retention-days: 30
  scope:
    # One explicitly authorized bootstrap PR imports the existing foundation.
    # This exception expires once main advances beyond its original commit.
    if: ${{ !(github.head_ref == 'work' && github.event.pull_request.base.sha == '5b5f06f87d21f16cb14c6165e75854a29dc191ec') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run trusted base code, not scripts modified by the pull request.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: candidate
          # Keep commit history for merge-base and every changed path, but
          # materialize only the modules/config/tests used by scope checks.
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            src
            test
            .github
            drizzle
            hosted
            data/research-geography-gate.json
            package.json
            package-lock.json
            requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Read pull request commit and check owned paths
        env:
          LANE_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: candidate
        shell: bash
        run: |
          if [[ "$LANE_BRANCH" != geography/* ]]; then
            node ../trusted/scripts/check-handoff-scope.mjs --branch "$LANE_BRANCH" --base "$BASE_SHA" --head HEAD --pr-event-file "$GITHUB_EVENT_PATH"
          fi
          # Geography ownership must come from the actual linked issue in the next step.
      - name: Verify linked issue type with read-only GitHub access
        env:
          LANE_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        working-directory: candidate
        shell: bash
        run: |
          if test -f ../trusted/scripts/check-linked-github-issue.mjs; then
            node ../trusted/scripts/check-linked-github-issue.mjs
          else
            # This migration PR uses the preceding trusted scope policy.
            # New issue-type checks take effect after it merges into main.
            echo "Pre-Issues trusted base: linked issue type verified by maintainer."
          fi
      - name: Check worker reservations and regional content gates
        working-directory: candidate
        run: node --test test/handoff-scope.test.mjs test/issue-claims.test.mjs test/worker-result.test.mjs test/regional-research-gate.test.mjs test/geography-worker-lane.test.mjs test/evidence-quality.test.mjs test/historical-evidence.test.mjs test/premerge-evidence.test.mjs test/trusted-workflow-checkouts.test.mjs
  initial-foundation:
    if: github.head_ref == 'work' && github.event.pull_request.base.sha == '5b5f06f87d21f16cb14c6165e75854a29dc191ec'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify initial handover policy without provider operations
        run: node --test test/handoff-scope.test.mjs
