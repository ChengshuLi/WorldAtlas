name: Handoff lane scope

on:
  pull_request:
    branches: [work]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run trusted base code, not scripts modified by the pull request.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Read pull request commit and check owned paths
        env:
          LANE_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: candidate
        shell: bash
        run: |
          node ../trusted/scripts/check-handoff-scope.mjs --branch "$LANE_BRANCH" --base "$BASE_SHA" --head HEAD
