name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.paths.outputs.python }}
      imports: ${{ steps.paths.outputs.imports }}
      map: ${{ steps.paths.outputs.map }}
      releases: ${{ steps.paths.outputs.releases }}
      sql: ${{ steps.paths.outputs.sql }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Test CI selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: python3 .github/scripts/select_tests.py
  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: sources-${{ runner.arch }}-${{ hashFiles('environment.yml') }}
      - name: Test source imports with disposable PostgreSQL
        if: needs.changes.outputs.imports == 'true' || needs.changes.outputs.map == 'true' || needs.changes.outputs.sql == 'true'
        shell: bash -el {0}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          PYTHONPATH: scripts/source-imports:scripts/map-build
          PROJ_NETWORK: 'OFF'
          RUN_IMPORTS: ${{ needs.changes.outputs.imports }}
          RUN_MAP: ${{ needs.changes.outputs.map }}
          RUN_SQL: ${{ needs.changes.outputs.sql }}
        run: |
          set -euo pipefail
          database_dir=$(TMPDIR=/tmp mktemp -d)
          trap 'pg_ctl -D "$database_dir/data" -m fast -w stop; rm -rf "$database_dir"' EXIT
          initdb -D "$database_dir/data" -U postgres -A trust --no-locale --encoding=UTF8
          pg_ctl -D "$database_dir/data" -l "$database_dir/postgres.log" \
            -o "-k $database_dir -p 5432 -c listen_addresses=''" -w start
          psql -h "$database_dir" -U postgres -v ON_ERROR_STOP=1 \
            -f database/migrations/001_initial_schema.sql
          if [[ "$RUN_SQL" == true ]]; then
            for check in database/tests/*.sql; do
              psql -Xq -h "$database_dir" -U postgres -v ON_ERROR_STOP=1 -f "$check"
            done
          fi
          export WORLDATLAS_TEST_DATABASE_URL="postgresql://postgres@/postgres?host=$database_dir"
          if [[ "$RUN_IMPORTS" == true ]]; then
            time python -m unittest discover -s scripts/source-imports -p 'test_*.py'
          fi
          if [[ "$RUN_MAP" == true ]]; then
            time python -m unittest discover -s scripts/map-build/map_build -t scripts/map-build
          fi
      - name: Test release staging
        if: needs.changes.outputs.releases == 'true'
        shell: bash -el {0}
        env:
          PROJ_NETWORK: 'OFF'
          PYTHONPATH: scripts/map-build
        run: time python -m unittest discover -s scripts/map-releases -p 'test_*.py'
  website:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
