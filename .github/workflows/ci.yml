name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: sources-${{ runner.arch }}-${{ hashFiles('environment.yml') }}
      - name: Install WorldAtlas
        shell: bash -el {0}
        run: python -m pip install --force-reinstall "${{ runner.os == 'Linux' && '.[checks]' || '.' }}"
      - name: Locate PostgreSQL on macOS
        if: runner.os == 'macOS'
        id: postgres
        shell: bash -el {0}
        run: |
          echo "version=$(pg_config --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "libdir=$(pg_config --pkglibdir)" >> "$GITHUB_OUTPUT"
          echo "sharedir=$(pg_config --sharedir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: runner.os == 'macOS'
        with:
          path: |
            ${{ steps.postgres.outputs.libdir }}/pg_jsonschema.dylib
            ${{ steps.postgres.outputs.sharedir }}/extension/pg_jsonschema*
          key: pg-jsonschema-${{ runner.os }}-${{ runner.arch }}-${{ steps.postgres.outputs.version }}-${{ hashFiles('database/tests/install_pg_jsonschema.sh') }}
      - name: Install the PostgreSQL JSON Schema extension
        shell: bash -el {0}
        run: bash database/tests/install_pg_jsonschema.sh
      - name: Run Python and database tests with Numba enabled
        if: runner.os == 'macOS'
        shell: bash -el {0}
        env:
          TMPDIR: ${{ runner.temp }}
          PROJ_NETWORK: 'OFF'
        run: python .github/scripts/run_tests.py
      - name: Run Python code checks and coverage tests concurrently
        if: runner.os == 'Linux'
        shell: bash -el {0}
        env:
          TMPDIR: ${{ runner.temp }}
          PROJ_NETWORK: 'OFF'
          NUMBA_DISABLE_JIT: '1'
        run: |
          (
            python -m ruff check src/worldatlas .github/scripts
            python -m ruff format --check src/worldatlas .github/scripts
            npx --yes pyright@1.1.414 --pythonpath "$(command -v python)"
          ) & code_checks=$!
          (
            python -m coverage run .github/scripts/run_tests.py
            python -m coverage combine
            python -m coverage report
          ) & coverage_tests=$!
          status=0
          wait "$code_checks" || status=1
          wait "$coverage_tests" || status=1
          exit "$status"
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run website tests in parallel
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          npm test & unit_tests=$!
          npm run test:browser & browser_tests=$!
          status=0
          wait "$unit_tests" || status=1
          wait "$browser_tests" || status=1
          exit "$status"
