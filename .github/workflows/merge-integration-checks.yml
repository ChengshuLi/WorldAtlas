name: Trusted author scope and evidence
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
# Only superseded read-only heads are canceled; mutation workflows stay separate.
concurrency:
  group: worldatlas-author-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# Actual geography, package and regression run once on the final queue candidate.

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      geography_baseline: ${{ steps.geographic_parent.outputs.baseline }}
      owned_paths: ${{ steps.select.outputs.owned_paths }}
      pr_body: ${{ steps.select.outputs.pr_body }}
    steps:
      # PR base.sha is an opening snapshot; the event merge can include newer main.
      - name: Resolve accepted geographic candidate parent
        id: geographic_parent
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.sha }}
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import json, os, re, urllib.request
          def sha(value):
              if not isinstance(value, str) or not re.fullmatch(r'[0-9a-f]{40}', value):
                  raise SystemExit('Invalid immutable geographic commit')
              return value
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise SystemExit('Unexpected GitHub API redirect')
          opener = urllib.request.build_opener(NoRedirect())
          def api(route):
              request = urllib.request.Request('https://api.github.com/repos/ChengshuLi/WorldAtlas/' + route,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with opener.open(request, timeout=20) as response:
                  raw = response.read(8 * 1024 * 1024 + 1)
              if len(raw) > 8 * 1024 * 1024:
                  raise SystemExit('Oversized GitHub commit response')
              return json.loads(raw)
          candidate, head = sha(os.environ['CANDIDATE']), sha(os.environ['REVIEWED_HEAD'])
          commit = api('git/commits/' + candidate)
          parents = [sha(parent['sha']) for parent in commit['parents']]
          if commit['sha'] != candidate or len(parents) != 2 or parents[1] != head or parents[0] == head:
              raise SystemExit('Candidate must merge accepted main with exact reviewed head')
          baseline = parents[0]
          main = sha(api('git/ref/heads/main')['object']['sha'])
          if baseline != main:
              comparison = api('compare/' + baseline + '...' + main + '?per_page=1')
              if (comparison.get('status') != 'ahead' or
                  comparison.get('base_commit', {}).get('sha') != baseline or
                  comparison.get('merge_base_commit', {}).get('sha') != baseline):
                  raise SystemExit('Candidate parent is not accepted main ancestry')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('baseline=' + baseline + '\n')
          PYTHON
      # Only trusted base modules receive the read-only token.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.geographic_parent.outputs.baseline }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: select
        name: Validate ownership and focused CI applicability
        env:
          GH_TOKEN: ${{ github.token }}
          PR_GATE_PHASE: metadata
          PR_GATE_CODE_COMMIT: ${{ steps.geographic_parent.outputs.baseline }}
        run: node scripts/check-pr-gates.mjs
      - name: Diagnose failed API read without changing validation outcome
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_REPO: ${{ github.repository }}
          DIAGNOSTIC_PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'DIAGNOSTIC'
          const repo = process.env.DIAGNOSTIC_REPO, number = process.env.DIAGNOSTIC_PR, token = process.env.GH_TOKEN;
          const safe = value => {
            let text = String(value ?? '');
            if (token) text = text.split(token).join('[redacted]');
            return text.replace(/(?:github_pat_|gh[pousr]_)[A-Za-z0-9_]+/g, '[redacted]')
              .replace(/Bearer\s+\S+/gi, 'Bearer [redacted]').replace(/[\x00-\x1f\x7f]/g, ' ').slice(0, 512);
          };
          const result = {phase: 'failed-profile-job-api-probe', validation_bypassed: false};
          try {
            if (!/^[-\w.]+\/[-\w.]+$/.test(repo ?? '') || !/^[1-9]\d*$/.test(number ?? '') || !token) throw Error('Invalid diagnostic context');
            const response = await fetch(`https://api.github.com/repos/${repo}/pulls/${number}`, {
              headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
              signal: AbortSignal.timeout(20000)
            });
            result.http_status = response.status;
            for (const [key, header] of [['rate_remaining', 'x-ratelimit-remaining'], ['rate_reset', 'x-ratelimit-reset'], ['retry_after', 'retry-after']]) {
              const value = response.headers.get(header); if (/^\d{1,13}$/.test(value ?? '')) result[key] = safe(value);
            }
            const request = response.headers.get('x-github-request-id');
            if (/^[a-fA-F0-9:]{1,100}$/.test(request ?? '')) result.request_id = safe(request);
            if (!response.ok) {
              let body; try { body = await response.json(); } catch { /* HTTP denial remains visible. */ }
              if (typeof body?.message === 'string') result.message = safe(body.message);
            } else await response.body?.cancel();
          } catch (error) { result.diagnostic_error = safe(error.message); }
          console.log(JSON.stringify(result));
          DIAGNOSTIC
      - name: Retain trusted gate result and applicability
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-pr-gates-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            pr-gates.json
            evidence-check.json
          if-no-files-found: ignore
          retention-days: 30
  evidence:
    # Evidence transport and semantic checks run alongside selection/tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate exact-head evidence with trusted code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_GATE_PHASE: evidence
        run: node scripts/check-pr-gates.mjs
      - name: Retain trusted evidence result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-pr-evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            pr-gates.json
            evidence-check.json
          if-no-files-found: ignore
          retention-days: 30
  scope:
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run trusted base code, not scripts modified by the pull request.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.profile.outputs.geography_baseline }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          # Keep commit history for merge-base and every changed path, but
          # materialize only the modules/config/tests used by scope checks.
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            src
            test
            .github
            drizzle
            hosted
            coordination/engineering/selected-geography-effective-prevention-20261009
            coordination/engineering/additive-native-gap-batch-20261008/composition-v2/compose-retained.mjs
            coordination/engineering/native-grid-fidelity-1010-20261005-local15/results-v1/native-row-latitudes.f64le.gz
            docs/LOCAL_WORKSPACES.md
            coordination/engineering/selected-checkpoint-reuse-20261012/accepted-checkpoints.json
            data/research-geography-gate.json
            package.json
            package-lock.json
            requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Check exact head paths with trusted code and authenticated issue ownership
        env:
          LANE_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ needs.profile.outputs.geography_baseline }}
          OWNED_PATHS: ${{ needs.profile.outputs.owned_paths }}
          PR_BODY_JSON: ${{ needs.profile.outputs.pr_body }}
        working-directory: candidate
        run: |
          node --input-type=module <<'NODE'
          import {checkGitScope} from '../trusted/scripts/check-handoff-scope.mjs';
          console.log(JSON.stringify(checkGitScope({branch: process.env.LANE_BRANCH,
            base: process.env.BASE_SHA, head: 'HEAD', ownedPaths: JSON.parse(process.env.OWNED_PATHS),
            prBody: JSON.parse(process.env.PR_BODY_JSON)})));
          NODE
      - name: Check worker reservations and regional content gates
        working-directory: candidate
        run: node --test test/handoff-scope.test.mjs test/issue-claims.test.mjs test/worker-result.test.mjs test/regional-research-gate.test.mjs test/geography-worker-lane.test.mjs test/evidence-quality.test.mjs test/historical-evidence.test.mjs test/premerge-evidence.test.mjs test/trusted-workflow-checkouts.test.mjs
