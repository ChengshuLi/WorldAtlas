name: Integration queue regression
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
# Only superseded read-only heads are canceled; mutation workflows stay separate.
concurrency:
  # Body edits refresh authority without canceling code work.
  group: worldatlas-regression-pr-${{ github.event.pull_request.number }}-${{ (github.event.action == 'edited' || github.event.action == 'ready_for_review') && 'metadata' || 'code' }}
  cancel-in-progress: true
# The intended normal package target is Cloudflare; the separate Site gate is retained.

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      profile: ${{ steps.select.outputs.profile }}
      shards: ${{ steps.metadata_regression.outputs.reused == 'true' && '[0]' || steps.select.outputs.shards }}
      metadata_reuse: ${{ steps.metadata_regression.outputs.reused }}
      original_run: ${{ steps.metadata_regression.outputs.source_run }}
      original_attempt: ${{ steps.metadata_regression.outputs.source_attempt }}
      original_head: ${{ steps.metadata_regression.outputs.source_head }}
      test_selection: ${{ steps.select.outputs.test_selection }}
      expectations_path: ${{ steps.select.outputs.expectations_path }}
      owned_paths: ${{ steps.select.outputs.owned_paths }}
      pr_body: ${{ steps.select.outputs.pr_body }}
      full: ${{ steps.select.outputs.full }}
      blocked: ${{ steps.select.outputs.blocked }}
    steps:
      # Only trusted base modules receive the read-only token.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: select
        name: Validate ownership and focused CI applicability
        env:
          GH_TOKEN: ${{ github.token }}
          PR_GATE_PHASE: metadata
        run: |
          if test -f scripts/check-pr-gates.mjs; then
            node scripts/check-pr-gates.mjs
          else
            # Bounded activation compatibility: all existing trusted checks run.
            # No candidate helper is substituted for absent baseline code.
            test "$GITHUB_HEAD_REF" = engineering/global-quota-1543-20261009
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {githubAPI} from './scripts/issue-claim-contract.mjs';
          import {checkLinkedIssue} from './scripts/check-linked-github-issue.mjs';
          import {selectIntegrationProfile} from './scripts/check-integration-profile.mjs';
          import {deploymentBudgetProfile} from './scripts/classify-deployment-budget.mjs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repo = process.env.GITHUB_REPOSITORY, token = process.env.GH_TOKEN, api = githubAPI(token);
          const pr = await api(`/repos/${repo}/pulls/${event.pull_request.number}`);
          if (pr.head.sha !== event.pull_request.head.sha || pr.head.ref !== process.env.GITHUB_HEAD_REF) throw Error('Activation head changed');
          const linked = await checkLinkedIssue({branch: pr.head.ref, event: {...event, pull_request: {...event.pull_request, body: pr.body}}, token, api, checkClaim: true});
          const regression = await selectIntegrationProfile({event, repo, api});
          const packageProfile = await deploymentBudgetProfile({event, eventName: 'pull_request', repository: repo, api});
          if (packageProfile.blocked) throw Error('Activation package classification is quota-blocked');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `profile=${regression.profile}\nshards=${JSON.stringify(regression.shards)}\nowned_paths=${JSON.stringify(linked.owned_paths ?? [])}\npr_body=${JSON.stringify(pr.body ?? '')}\nfull=${packageProfile.full}\nblocked=false\n`);
          NODE
          fi
      - name: Authenticate predecessor regression inputs
        id: metadata_regression
        if: steps.select.outputs.profile == 'full' && steps.select.outputs.test_selection != 'selected-data'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f scripts/reuse-pr-regression.mjs; then
            timeout --kill-after=5s 180s node scripts/reuse-pr-regression.mjs || echo 'reused=false' >> "$GITHUB_OUTPUT"
          else
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Diagnose failed API read without changing validation outcome
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_REPO: ${{ github.repository }}
          DIAGNOSTIC_PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'DIAGNOSTIC'
          const repo = process.env.DIAGNOSTIC_REPO, number = process.env.DIAGNOSTIC_PR, token = process.env.GH_TOKEN;
          const safe = value => {
            let text = String(value ?? '');
            if (token) text = text.split(token).join('[redacted]');
            return text.replace(/(?:github_pat_|gh[pousr]_)[A-Za-z0-9_]+/g, '[redacted]')
              .replace(/Bearer\s+\S+/gi, 'Bearer [redacted]').replace(/[\x00-\x1f\x7f]/g, ' ').slice(0, 512);
          };
          const result = {phase: 'failed-profile-job-api-probe', validation_bypassed: false};
          try {
            if (!/^[-\w.]+\/[-\w.]+$/.test(repo ?? '') || !/^[1-9]\d*$/.test(number ?? '') || !token) throw Error('Invalid diagnostic context');
            const response = await fetch(`https://api.github.com/repos/${repo}/pulls/${number}`, {
              headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
              signal: AbortSignal.timeout(20000)
            });
            result.http_status = response.status;
            for (const [key, header] of [['rate_remaining', 'x-ratelimit-remaining'], ['rate_reset', 'x-ratelimit-reset'], ['retry_after', 'retry-after']]) {
              const value = response.headers.get(header); if (/^\d{1,13}$/.test(value ?? '')) result[key] = safe(value);
            }
            const request = response.headers.get('x-github-request-id');
            if (/^[a-fA-F0-9:]{1,100}$/.test(request ?? '')) result.request_id = safe(request);
            if (!response.ok) {
              let body; try { body = await response.json(); } catch { /* HTTP denial remains visible. */ }
              if (typeof body?.message === 'string') result.message = safe(body.message);
            } else await response.body?.cancel();
          } catch (error) { result.diagnostic_error = safe(error.message); }
          console.log(JSON.stringify(result));
          DIAGNOSTIC
      - name: Retain trusted gate result and applicability
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-pr-gates-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            pr-gates.json
            evidence-check.json
          if-no-files-found: ignore
          retention-days: 30
  evidence:
    # Evidence transport and semantic checks run alongside selection/tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate exact-head evidence with trusted code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_GATE_PHASE: evidence
        run: |
          if test -f scripts/check-pr-gates.mjs; then
            node scripts/check-pr-gates.mjs
          else
            test "$GITHUB_HEAD_REF" = engineering/global-quota-1543-20261009
            node scripts/check-pr-evidence.mjs
          fi
      - name: Retain trusted evidence result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-pr-evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            pr-gates.json
            evidence-check.json
          if-no-files-found: ignore
          retention-days: 30
  scope:
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run trusted base code, not scripts modified by the pull request.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          # Keep commit history for merge-base and every changed path, but
          # materialize only the modules/config/tests used by scope checks.
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            src
            test
            .github
            drizzle
            hosted
            coordination/engineering/selected-geography-effective-prevention-20261009
            coordination/engineering/selected-checkpoint-reuse-20261012/accepted-checkpoints.json
            data/research-geography-gate.json
            package.json
            package-lock.json
            requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Check exact head paths with trusted code and authenticated issue ownership
        env:
          LANE_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OWNED_PATHS: ${{ needs.profile.outputs.owned_paths }}
          PR_BODY_JSON: ${{ needs.profile.outputs.pr_body }}
        working-directory: candidate
        run: |
          node --input-type=module <<'NODE'
          import {checkGitScope} from '../trusted/scripts/check-handoff-scope.mjs';
          console.log(JSON.stringify(checkGitScope({branch: process.env.LANE_BRANCH,
            base: process.env.BASE_SHA, head: 'HEAD', ownedPaths: JSON.parse(process.env.OWNED_PATHS),
            prBody: JSON.parse(process.env.PR_BODY_JSON)})));
          NODE
      - name: Check worker reservations and regional content gates
        working-directory: candidate
        run: node --test test/handoff-scope.test.mjs test/issue-claims.test.mjs test/worker-result.test.mjs test/regional-research-gate.test.mjs test/geography-worker-lane.test.mjs test/evidence-quality.test.mjs test/historical-evidence.test.mjs test/premerge-evidence.test.mjs test/trusted-workflow-checkouts.test.mjs
  geography:
    needs: profile
    # Ordinary selected data is checked once on the final composed candidate.
    if: github.event.action != 'edited' && github.event.action != 'ready_for_review' && needs.profile.outputs.test_selection != 'selected-data'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      # Trusted baseline code reads candidate blobs; candidate code never runs.
      - name: Checkout trusted geographic checker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
            coordination/engineering/selected-geography-effective-prevention-20261009
            coordination/engineering/selected-checkpoint-reuse-20261012
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Reuse original geography only for unchanged consumed inputs
        id: metadata_reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f scripts/reuse-pr-geography.mjs; then
            # Optional bounded discovery; timeout/unavailable proof runs the
            # ordinary checker below. Candidate code never executes here.
            timeout --kill-after=5s 180s node scripts/reuse-pr-geography.mjs || echo 'reused=false' >> "$GITHUB_OUTPUT"
          else
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.metadata_reuse.outputs.reused != 'true'
        with:
          python-version: '3.12'
      - name: Install trusted geographic dependencies
        if: steps.metadata_reuse.outputs.reused != 'true'
        run: python -m pip install -r requirements.txt
      - name: Check proposed geography with trusted baseline code
        if: steps.metadata_reuse.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEOGRAPHY_PR_NUMBER: ${{ github.event.pull_request.number }}
          GEOGRAPHY_REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          GEOGRAPHY_BASELINE: ${{ github.event.pull_request.base.sha }}
          # This event merge commit includes parallel main additions. Raw head
          # against current base would invent deletions that the PR never made.
          GEOGRAPHY_CANDIDATE: ${{ github.sha }}
          GEOGRAPHY_COMPARISON: pull-request-merge-v1
        run: |
          if test -f scripts/run-geographic-check.py; then
            python -I -B - --fetch --out geography-check.json <<'PY'
          import runpy, subprocess, sys
          try:
              runpy.run_path('scripts/run-geographic-check.py', run_name='__main__')
          except subprocess.CalledProcessError as error:
              if error.stderr:
                  sys.stderr.buffer.write(error.stderr)
                  sys.stderr.buffer.flush()
              raise
          PY
          else
            # Only this named activation branch can report bootstrap absence,
            # and only after trusted API code proves it changes no live data.
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {githubAPI, githubPages} from './scripts/issue-claim-contract.mjs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repo = process.env.GITHUB_REPOSITORY, number = event.pull_request?.number;
          if (!/^[-\w.]+\/[-\w.]+$/.test(repo ?? '') || !Number.isSafeInteger(number)) throw Error('Invalid bootstrap event');
          const api = githubAPI(process.env.GH_TOKEN), root = `/repos/${repo}`;
          const pr = await api(`${root}/pulls/${number}`);
          if (pr.head.sha !== process.env.GEOGRAPHY_CANDIDATE ||
              pr.head.ref !== 'engineering/geographic-gate-920-20261005-local04' ||
              pr.head.repo?.full_name !== repo || pr.base.ref !== 'main' ||
              !Number.isSafeInteger(pr.changed_files) || pr.changed_files < 1 || pr.changed_files > 3000) {
            throw Error('Geographic checker unavailable outside the bounded activation PR');
          }
          const files = await githubPages(api, `${root}/pulls/${number}/files`);
          if (files.length !== pr.changed_files || new Set(files.map(f => f.filename)).size !== files.length ||
              files.some(f => [f.filename, f.previous_filename].filter(Boolean).some(name => name.startsWith('data/')))) {
            throw Error('Bootstrap cannot waive changed live data or an incomplete inventory');
          }
          fs.writeFileSync('geography-check.json', JSON.stringify({status: 'bootstrap-unavailable',
            geometry_validated: false, live_data_changed: false, head_sha: pr.head.sha,
            limits: ['Only the named activation PR; the combined check becomes mandatory after merge.']}) + '\n');
          NODE
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.metadata_reuse.outputs.reused != 'true'
        with:
          name: proposed-geography-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            geography-check.json
            derived-certificate.json.gz
            derived-facts.json
            derived-publication.json
            facts.json
            operands.json.gz
            publication.json
            checkpoint-routes.json
            operating.json
          retention-days: 30
      - name: Retain predecessor geography equivalence
        if: steps.metadata_reuse.outputs.reused == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reused-geography-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: geography-reuse.json
          if-no-files-found: ignore
          retention-days: 30
  regression:
    needs: profile
    if: github.event.action != 'edited' && github.event.action != 'ready_for_review' && needs.profile.outputs.test_selection != 'selected-data'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.profile.outputs.shards) }}
    steps:
      - name: Authenticate trusted full-checkout bootstrap
        id: checkout_bootstrap
        if: needs.profile.outputs.profile == 'full'
        env:
          WORLDATLAS_CHECKOUT_TOKEN: ${{ github.token }}
          CI_CHECKOUT_REPOSITORY: ${{ github.repository }}
          CI_CHECKOUT_BASE: ${{ github.event.pull_request.base.sha }}
          CI_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
          CI_CHECKOUT_PR: ${{ github.event.pull_request.number }}
          CI_CHECKOUT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 -I -S -B - <<'CHECKOUT_BOOTSTRAP'
          import base64, hashlib, json, os, pathlib, re, signal, tempfile, time, urllib.request
          started = time.monotonic()
          signal.signal(signal.SIGALRM, lambda *_: (_ for _ in ()).throw(TimeoutError()))
          signal.setitimer(signal.ITIMER_REAL, 60)
          def need(ok):
              if not ok: raise ValueError('Invalid authenticated checkout metadata')
          def oid(value): return isinstance(value, str) and re.fullmatch('[0-9a-f]{40}', value)
          def object_hash(kind, raw): return hashlib.sha1((kind + ' ' + str(len(raw)) + '\0').encode() + raw).hexdigest()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_): raise ValueError('API redirects are not checkout authority')
          try:
              repo, base, candidate = (os.environ[key] for key in ('CI_CHECKOUT_REPOSITORY', 'CI_CHECKOUT_BASE', 'CI_CHECKOUT_SHA'))
              token = os.environ['WORLDATLAS_CHECKOUT_TOKEN']
              need(repo == 'ChengshuLi/WorldAtlas' and oid(base) and oid(candidate) and bool(token))
              consumed = 0
              opener = urllib.request.build_opener(NoRedirect())
              def api(route):
                  global consumed
                  remaining = 60 - (time.monotonic() - started)
                  need(remaining > 0)
                  request = urllib.request.Request('https://api.github.com/repos/' + repo + route,
                      headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
                  with opener.open(request, timeout=min(20, remaining)) as response:
                      need(response.status == 200)
                      raw = response.read(2 * 1024 * 1024 + 1)
                  consumed += len(raw)
                  need(len(raw) <= 2 * 1024 * 1024 and consumed <= 8 * 1024 * 1024)
                  value = json.loads(raw)
                  need(isinstance(value, dict))
                  return value
              number = os.environ.get('CI_CHECKOUT_PR', '')
              if number:
                  need(re.fullmatch('[1-9][0-9]*', number))
                  pr = api('/pulls/' + number)
                  need(pr.get('number') == int(number) and pr.get('state') == 'open'
                      and oid(pr['base']['sha']) and pr['base']['ref'] == 'main' and pr['base']['repo']['full_name'] == repo
                      and pr['head']['sha'] == candidate and pr['head']['repo']['full_name'] == repo
                      and pr['head']['ref'] == os.environ['CI_CHECKOUT_HEAD_REF'])
              def commit(sha):
                  value = api('/git/commits/' + sha)
                  need(value.get('sha') == sha and oid(value.get('tree', {}).get('sha')))
                  return value['tree']['sha']
              candidate_tree, base_tree = commit(candidate), commit(base)
              def tree(sha):
                  value = api('/git/trees/' + sha)
                  need(value.get('sha') == sha and value.get('truncated') is False and isinstance(value.get('tree'), list))
                  entries, raw = {}, []
                  kinds = {'040000': 'tree', '100644': 'blob', '100755': 'blob', '120000': 'blob', '160000': 'commit'}
                  for row in value['tree']:
                      name, mode, kind, child = (row.get(key) for key in ('path', 'mode', 'type', 'sha'))
                      need(isinstance(name, str) and name not in ('', '.', '..') and '/' not in name and '\0' not in name
                          and name not in entries and mode in kinds and kind == kinds[mode] and oid(child))
                      encoded = name.encode('utf-8')
                      entries[name] = row
                      raw.append((encoded + (b'/' if kind == 'tree' else b'\0'), mode.lstrip('0').encode() + b' ' + encoded + b'\0' + bytes.fromhex(child)))
                  need(object_hash('tree', b''.join(body for _, body in sorted(raw))) == sha)
                  return entries
              scripts = tree(base_tree).get('scripts')
              helper = None
              if scripts is not None:
                  need(scripts['mode'] == '040000' and scripts['type'] == 'tree')
                  helper = tree(scripts['sha']).get('acquire-ci-checkout.py')
              mode, helper_path = 'legacy', ''
              if helper is not None:
                  need(helper['mode'] == '100644' and helper['type'] == 'blob')
                  blob = api('/git/blobs/' + helper['sha'])
                  need(blob.get('sha') == helper['sha'] and blob.get('encoding') == 'base64'
                      and type(blob.get('size')) is int and 0 < blob['size'] <= 262144 and isinstance(blob.get('content'), str))
                  raw = base64.b64decode(''.join(blob['content'].split()), validate=True)
                  need(len(raw) == blob['size'] and object_hash('blob', raw) == helper['sha'])
                  root = pathlib.Path(os.environ['RUNNER_TEMP'])
                  need(root.is_dir() and not root.is_symlink() and str(root.resolve()) == str(root) and '\n' not in str(root))
                  directory = pathlib.Path(tempfile.mkdtemp(prefix='worldatlas-checkout-bootstrap-', dir=root))
                  helper_path = str(directory / 'acquire-ci-checkout.py')
                  with open(helper_path, 'xb') as output:
                      output.write(raw); output.flush(); os.fsync(output.fileno())
                  mode = 'helper'
              # Measure after the authenticated helper has actually reached durable disk.
              elapsed = time.monotonic() - started
              need(0 <= elapsed < 60)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(f'mode={mode}\nhelper={helper_path}\nsha={candidate}\ntree={candidate_tree}\nelapsed={elapsed:.6f}\n')
          except Exception:
              raise SystemExit('Trusted checkout bootstrap failed; no legacy fallback authorized')
          finally:
              signal.setitimer(signal.ITIMER_REAL, 0)
          CHECKOUT_BOOTSTRAP
      - name: Acquire full checkout with authenticated bounded helper
        if: (needs.profile.outputs.profile == 'full') && steps.checkout_bootstrap.outputs.mode == 'helper'
        env:
          WORLDATLAS_CHECKOUT_TOKEN: ${{ github.token }}
          CI_CHECKOUT_HELPER: ${{ steps.checkout_bootstrap.outputs.helper }}
          CI_CHECKOUT_SHA: ${{ steps.checkout_bootstrap.outputs.sha }}
          CI_CHECKOUT_TREE: ${{ steps.checkout_bootstrap.outputs.tree }}
          CI_BOOTSTRAP_ELAPSED: ${{ steps.checkout_bootstrap.outputs.elapsed }}
        run: |
          python3 -I -S -B "$CI_CHECKOUT_HELPER" --repository ChengshuLi/WorldAtlas \
            --sha "$CI_CHECKOUT_SHA" --tree "$CI_CHECKOUT_TREE" --workspace "$GITHUB_WORKSPACE" \
            --fetch-timeout-seconds 240 --total-timeout-seconds 420 --max-attempts 2 --elapsed-seconds "$CI_BOOTSTRAP_ELAPSED"
      - name: Legacy full checkout only for proven trusted-helper absence
        if: (needs.profile.outputs.profile == 'full') && steps.checkout_bootstrap.outputs.mode == 'legacy'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.checkout_bootstrap.outputs.sha }}
          persist-credentials: false
      - name: Checkout reviewed head
        if: needs.profile.outputs.profile == 'full'
        env:
          CI_CHECKOUT_REPOSITORY: ${{ github.repository }}
          CI_CHECKOUT_SHA: ${{ steps.checkout_bootstrap.outputs.sha }}
          CI_CHECKOUT_TREE: ${{ steps.checkout_bootstrap.outputs.tree }}
        run: |
          python3 -I -S -B - <<'CHECKOUT_VERIFY'
          import os, re, subprocess, urllib.parse
