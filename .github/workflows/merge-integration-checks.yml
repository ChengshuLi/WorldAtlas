name: Integration queue regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
# Superseded read-only PR tests cannot satisfy the new exact head.
concurrency:
  group: worldatlas-regression-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.select.outputs.profile }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f scripts/check-integration-profile.mjs; then
            node scripts/check-integration-profile.mjs
          else
            echo 'profile=full' >> "$GITHUB_OUTPUT"
            echo 'shards=[0,1,2]' >> "$GITHUB_OUTPUT"
          fi
      - name: Diagnose failed API read without changing validation outcome
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_REPO: ${{ github.repository }}
          DIAGNOSTIC_PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'DIAGNOSTIC'
          const repo = process.env.DIAGNOSTIC_REPO, number = process.env.DIAGNOSTIC_PR, token = process.env.GH_TOKEN;
          const safe = value => {
            let text = String(value ?? '');
            if (token) text = text.split(token).join('[redacted]');
            return text.replace(/(?:github_pat_|gh[pousr]_)[A-Za-z0-9_]+/g, '[redacted]')
              .replace(/Bearer\s+\S+/gi, 'Bearer [redacted]').replace(/[\x00-\x1f\x7f]/g, ' ').slice(0, 512);
          };
          const result = {phase: 'failed-profile-job-api-probe', validation_bypassed: false};
          try {
            if (!/^[-\w.]+\/[-\w.]+$/.test(repo ?? '') || !/^[1-9]\d*$/.test(number ?? '') || !token) throw Error('Invalid diagnostic context');
            const response = await fetch(`https://api.github.com/repos/${repo}/pulls/${number}`, {
              headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
              signal: AbortSignal.timeout(20000)
            });
            result.http_status = response.status;
            for (const [key, header] of [['rate_remaining', 'x-ratelimit-remaining'], ['rate_reset', 'x-ratelimit-reset'], ['retry_after', 'retry-after']]) {
              const value = response.headers.get(header); if (/^\d{1,13}$/.test(value ?? '')) result[key] = safe(value);
            }
            const request = response.headers.get('x-github-request-id');
            if (/^[a-fA-F0-9:]{1,100}$/.test(request ?? '')) result.request_id = safe(request);
            if (!response.ok) {
              let body; try { body = await response.json(); } catch { /* HTTP denial remains visible. */ }
              if (typeof body?.message === 'string') result.message = safe(body.message);
            } else await response.body?.cancel();
          } catch (error) { result.diagnostic_error = safe(error.message); }
          console.log(JSON.stringify(result));
          DIAGNOSTIC
  geography:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      # Trusted baseline code reads candidate blobs; candidate code never runs.
      - name: Checkout trusted geographic checker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install trusted geographic dependencies
        run: python -m pip install -r requirements.txt
      - name: Check proposed geography with trusted baseline code
        env:
          GH_TOKEN: ${{ github.token }}
          GEOGRAPHY_PR_NUMBER: ${{ github.event.pull_request.number }}
          GEOGRAPHY_REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
          GEOGRAPHY_BASELINE: ${{ github.event.pull_request.base.sha }}
          GEOGRAPHY_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          if test -f scripts/run-geographic-check.py; then
            python -I -B scripts/run-geographic-check.py --fetch --out geography-check.json
          else
            # Only this named activation branch can report bootstrap absence,
            # and only after trusted API code proves it changes no live data.
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {githubAPI, githubPages} from './scripts/issue-claim-contract.mjs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repo = process.env.GITHUB_REPOSITORY, number = event.pull_request?.number;
          if (!/^[-\w.]+\/[-\w.]+$/.test(repo ?? '') || !Number.isSafeInteger(number)) throw Error('Invalid bootstrap event');
          const api = githubAPI(process.env.GH_TOKEN), root = `/repos/${repo}`;
          const pr = await api(`${root}/pulls/${number}`);
          if (pr.head.sha !== process.env.GEOGRAPHY_CANDIDATE ||
              pr.head.ref !== 'engineering/geographic-gate-920-20261005-local04' ||
              pr.head.repo?.full_name !== repo || pr.base.ref !== 'main' ||
              !Number.isSafeInteger(pr.changed_files) || pr.changed_files < 1 || pr.changed_files > 3000) {
            throw Error('Geographic checker unavailable outside the bounded activation PR');
          }
          const files = await githubPages(api, `${root}/pulls/${number}/files`);
          if (files.length !== pr.changed_files || new Set(files.map(f => f.filename)).size !== files.length ||
              files.some(f => [f.filename, f.previous_filename].filter(Boolean).some(name => name.startsWith('data/')))) {
            throw Error('Bootstrap cannot waive changed live data or an incomplete inventory');
          }
          fs.writeFileSync('geography-check.json', JSON.stringify({status: 'bootstrap-unavailable',
            geometry_validated: false, live_data_changed: false, head_sha: pr.head.sha,
            limits: ['Only the named activation PR; the combined check becomes mandatory after merge.']}) + '\n');
          NODE
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proposed-geography-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: geography-check.json
          retention-days: 30
  regression:
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.profile.outputs.shards) }}
    steps:
      - name: Checkout reviewed head
        if: needs.profile.outputs.profile == 'full'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout reviewed head
        if: needs.profile.outputs.profile == 'evidence'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            src
            test
            .github
            drizzle
            hosted
            data/research-geography-gate.json
            package.json
            package-lock.json
            requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        if: needs.profile.outputs.profile == 'full'
        run: npm ci --no-audit --no-fund
      - name: Install Python dependencies
        if: needs.profile.outputs.profile == 'full'
        run: python -m pip install -r requirements.txt
      - name: Install browser dependencies only for tests that use Playwright
        env:
          INTEGRATION_PROFILE: ${{ needs.profile.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: |
          if node --input-type=module -e "import {integrationNeedsBrowser} from './scripts/run-integration-tests.mjs'; process.exit(integrationNeedsBrowser(process.env.INTEGRATION_PROFILE, Number(process.env.INTEGRATION_SHARD)) ? 0 : 1)"; then
            npx playwright install --with-deps chromium
          fi
      - name: Build hosted assets
        if: needs.profile.outputs.profile == 'full' && matrix.shard == 0
        run: npm run build:hosted
      - name: Complete regression shard
        env:
          INTEGRATION_PROFILE: ${{ needs.profile.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: node scripts/run-integration-tests.mjs
