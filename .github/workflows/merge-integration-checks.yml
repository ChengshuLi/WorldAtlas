name: Integration queue regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/merge-integration.mjs'
      - 'scripts/run-integration-tests.mjs'
      - 'scripts/run-worker-merge.mjs'
      - 'scripts/queue-pr-merge.mjs'
      - 'test/merge-integration*.test.mjs'
      - '.github/workflows/worker-merge.yml'
      - '.github/workflows/merge-integration-checks.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r requirements.txt
      - name: Install browser dependencies only for tests that use Playwright
        env:
          INTEGRATION_PROFILE: full
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: |
          if node --input-type=module -e "import {integrationNeedsBrowser} from './scripts/run-integration-tests.mjs'; process.exit(integrationNeedsBrowser(process.env.INTEGRATION_PROFILE, Number(process.env.INTEGRATION_SHARD)) ? 0 : 1)"; then
            npx playwright install --with-deps chromium
          fi
      - name: Build once before asset-dependent regression tests
        if: matrix.shard == 0
        run: npm run build:hosted
      - name: Complete regression shard
        env:
          INTEGRATION_PROFILE: full
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: node scripts/run-integration-tests.mjs
