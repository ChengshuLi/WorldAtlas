name: Integration queue regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/merge-integration.mjs'
      - 'scripts/run-worker-merge.mjs'
      - 'scripts/queue-pr-merge.mjs'
      - 'test/merge-integration*.test.mjs'
      - '.github/workflows/worker-merge.yml'
      - '.github/workflows/merge-integration-checks.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r requirements.txt
      - run: npm test
