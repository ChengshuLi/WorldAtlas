name: Source imports
on:
  pull_request:
    paths:
      - 'environment.yml'
      - 'scripts/source-imports/**'
      - 'scripts/map-build/pipeline/**'
      - 'scripts/map-build/stages/land/stage2-geodesic-20261104/contracts.py'
      - 'scripts/map-build/stages/land/stage2-geodesic-20261104/seed-producer/**'
      - 'database/migrations/001_initial_schema.sql'
      - '.github/workflows/source-imports.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: sources-${{ runner.arch }}-${{ hashFiles('environment.yml') }}
      - name: Test source imports with disposable PostgreSQL
        shell: bash -el {0}
        env:
          PYTHONPATH: scripts/source-imports
          PROJ_NETWORK: 'OFF'
        run: |
          set -euo pipefail
          database_dir=$(TMPDIR=/tmp mktemp -d)
          trap 'pg_ctl -D "$database_dir/data" -m fast -w stop; rm -rf "$database_dir"' EXIT
          initdb -D "$database_dir/data" -U postgres -A trust --no-locale --encoding=UTF8
          pg_ctl -D "$database_dir/data" -l "$database_dir/postgres.log" \
            -o "-k $database_dir -p 5432 -c listen_addresses=''" -w start
          psql -h "$database_dir" -U postgres -v ON_ERROR_STOP=1 \
            -f database/migrations/001_initial_schema.sql
          export WORLDATLAS_TEST_DATABASE_URL="postgresql://postgres@/postgres?host=$database_dir"
          time python -m unittest discover -s scripts/source-imports -p 'test_*.py'
      - name: Test pipeline and source references
        shell: bash -el {0}
        env:
          PROJ_NETWORK: 'OFF'
          PYTHONPATH: scripts/map-build/stages/land/stage2-geodesic-20261104
        run: |
          time python -m unittest discover -s scripts/map-build/pipeline -p 'test_*.py'
          python -m unittest discover -s scripts/map-build/stages/land/stage2-geodesic-20261104/seed-producer -p 'test_*.py'
          python -m unittest discover -s scripts/map-build/stages/land/stage2-geodesic-20261104 -p 'test_contracts.py'
