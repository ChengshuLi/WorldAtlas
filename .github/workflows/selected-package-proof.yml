name: Selected package equivalence proof
on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact candidate commit from the successful full queue readback
        required: true
      original_run_id:
        description: Successful A producer with retained original package output
        required: true
      readback_run_id:
        description: Worker-merge run with a successful full B producer
        required: true
      readback_attempt:
        description: Exact successful B run attempt
        required: true
      expectations_path:
        description: Reviewed B selected-delivery-expectations.json path
        required: true
permissions: {}
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: candidate
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Validate exact proof source
        working-directory: .
        env:
          SOURCE_HEAD: ${{ inputs.source_head }}
        run: '[[ "$SOURCE_HEAD" =~ ^[a-f0-9]{40}$ ]]'
      - name: Checkout current proof implementation separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: proof-tools
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
          fetch-depth: 1
      - name: Checkout frozen production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_head }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate complete accepted frozen programme
        id: frozen
        working-directory: proof-tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/run-selected-package-proof.mjs --resolve-frozen
      - name: Authenticate installer inputs before candidate dependency execution
        env:
          SELECTED_PACKAGE_PREFLIGHT: install
          GH_TOKEN: ${{ github.token }}
          SELECTED_PACKAGE_TRUSTED_BASE: ${{ steps.frozen.outputs.programme_sha }}
        run: |
          python3 -I -B - <<'INSTALLER_PREFLIGHT'
          import base64, hashlib, json, os, re, urllib.request
          base = os.environ['SELECTED_PACKAGE_TRUSTED_BASE']
          assert re.fullmatch('[a-f0-9]{40}', base)
          assert os.environ['GITHUB_REPOSITORY'] == 'ChengshuLi/WorldAtlas'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_): raise ValueError('Unexpected bootstrap redirect')
          url = 'https://api.github.com/repos/ChengshuLi/WorldAtlas/contents/scripts/selected-package-bootstrap.py?ref=' + os.environ['GITHUB_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
              raw = response.read(262145)
          assert len(raw) <= 262144
          blob = json.loads(raw)
          assert blob['type'] == 'file' and blob['encoding'] == 'base64' and blob['path'] == 'scripts/selected-package-bootstrap.py'
          body = base64.b64decode(''.join(blob['content'].split()), validate=True)
          assert len(body) == blob['size'] and hashlib.sha1(('blob ' + str(len(body)) + '\0').encode() + body).hexdigest() == blob['sha']
          exec(compile(body, '<authenticated trusted-base assembly bootstrap>', 'exec'), {'__name__':'__main__'})
          INSTALLER_PREFLIGHT
      - name: Install actual pinned dependencies
        run: |
          npm ci --no-audit --no-fund
          python -I -m pip install -r requirements.txt
      - name: Assemble frozen production source and compare with current proof implementation
        id: assembly
        working-directory: proof-tools
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PACKAGE_TRUSTED_BASE: ${{ github.sha }}
          SELECTED_PACKAGE_ENTRY_POINT: scripts/run-selected-package-proof.mjs
        run: |
          python3 -I -B - <<'ASSEMBLY_PROOF'
          import base64, hashlib, json, os, re, urllib.request
          base = os.environ['SELECTED_PACKAGE_TRUSTED_BASE']
          assert re.fullmatch('[a-f0-9]{40}', base)
          assert os.environ['GITHUB_REPOSITORY'] == 'ChengshuLi/WorldAtlas'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_): raise ValueError('Unexpected bootstrap redirect')
          url = 'https://api.github.com/repos/ChengshuLi/WorldAtlas/contents/scripts/selected-package-bootstrap.py?ref=' + os.environ['GITHUB_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
              raw = response.read(262145)
          assert len(raw) <= 262144
          blob = json.loads(raw)
          assert blob['type'] == 'file' and blob['encoding'] == 'base64' and blob['path'] == 'scripts/selected-package-bootstrap.py'
          body = base64.b64decode(''.join(blob['content'].split()), validate=True)
          assert len(body) == blob['size'] and hashlib.sha1(('blob ' + str(len(body)) + '\0').encode() + body).hexdigest() == blob['sha']
          exec(compile(body, '<authenticated trusted-base assembly bootstrap>', 'exec'), {'__name__':'__main__'})
          ASSEMBLY_PROOF
      - name: Read back actual assembled native output
        run: node coordination/engineering/arctic-three-retained-land-fit-repair-native-20261008/model-reader-call-boundary-controls.mjs --built-output-readback .cache/native-normal-built-output.json
      - name: Install current browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run genuine current selected output consumers
        env:
          INTEGRATION_PROFILE: full
          INTEGRATION_SHARD: '0'
          INTEGRATION_TEST_SELECTION: selected-output
          SELECTED_PACKAGE_ASSEMBLY_SHA256: ${{ steps.assembly.outputs.assembly_sha256 }}
          SELECTED_EXPECTATIONS_PATH: ${{ inputs.expectations_path }}
        run: |
          node --input-type=module -e 'import {selectedDeliverySmoke} from "./scripts/integration-profile.mjs"; console.log(JSON.stringify({selected_delivery_smoke:await selectedDeliverySmoke(process.env.SELECTED_EXPECTATIONS_PATH)}));'
          node scripts/run-integration-tests.mjs
      - name: Retain actual comparison and current consumer receipts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected-package-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/.cache/selected-package-proof.json
            candidate/.cache/selected-package-original-manifest.json
            candidate/.cache/package-input-build.json
            candidate/.cache/native-normal-built-output.json
            candidate/.cache/selected-delivery-smoke.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
