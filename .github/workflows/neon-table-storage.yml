name: Measure production PostgreSQL table storage (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-table-storage-readonly
  cancel-in-progress: false

jobs:
  measure:
    if: github.repository == 'ChengshuLi/WorldAtlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Measure fixed catalog queries in a read-only transaction
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/measure-neon-storage.mjs data/validation/neon-table-storage.json
      - name: Preserve sanitized observation
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: neon-table-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/validation/neon-table-storage.json
          if-no-files-found: error
          retention-days: 14
