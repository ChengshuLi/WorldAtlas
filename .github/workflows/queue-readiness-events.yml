name: Queue readiness events
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: queue-readiness-audit
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Event text/numbers are data. Never check out a PR head or execute it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Review affected issue and dependent candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/queue-readiness-event.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: queue-event-report
          path: queue-event-report.json
          if-no-files-found: warn
          retention-days: 30
