name: Queue readiness audit
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: queue-readiness-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Restore last complete audit
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .queue-audit/previous.json
          key: queue-audit-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: queue-audit-v1-
      - name: Read-only queue audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/queue-readiness-audit.mjs "$GITHUB_REPOSITORY" queue-readiness-report.json .queue-audit/previous.json
      - name: Flag original issues needing triage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f queue-readiness-report.json; then
            node scripts/queue-triage-flags.mjs queue-readiness-report.json
          fi
      - name: Preserve successful checkpoint
        run: |
          mkdir -p .queue-audit
          cp queue-readiness-report.json .queue-audit/previous.json
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .queue-audit/previous.json
          key: queue-audit-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish complete or incomplete report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-readiness-report
          path: queue-readiness-report.json
          if-no-files-found: error
          retention-days: 30
