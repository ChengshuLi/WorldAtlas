      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate selected package installer inputs
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && needs.prepare.outputs.test_selection == 'selected-data'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PACKAGE_TRUSTED_BASE: ${{ needs.prepare.outputs.base }}
          SELECTED_PACKAGE_ENTRY_POINT: scripts/assemble-selected-package.mjs
          SELECTED_PACKAGE_PREFLIGHT: install
        run: |
          python3 -I -S -B - <<'PACKAGE_BOOTSTRAP'
          import base64, hashlib, json, os, re, urllib.request
          base = os.environ['SELECTED_PACKAGE_TRUSTED_BASE']
          assert re.fullmatch('[a-f0-9]{40}', base)
          assert os.environ['GITHUB_REPOSITORY'] == 'ChengshuLi/WorldAtlas'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_): raise ValueError('Unexpected bootstrap redirect')
          url = 'https://api.github.com/repos/ChengshuLi/WorldAtlas/contents/scripts/selected-package-bootstrap.py?ref=' + base
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
              raw = response.read(262145)
          assert len(raw) <= 262144
          blob = json.loads(raw)
          assert blob['type'] == 'file' and blob['encoding'] == 'base64' and blob['path'] == 'scripts/selected-package-bootstrap.py'
          body = base64.b64decode(''.join(blob['content'].split()), validate=True)
          assert len(body) == blob['size'] and hashlib.sha1(('blob ' + str(len(body)) + '\0').encode() + body).hexdigest() == blob['sha']
          exec(compile(body, '<authenticated selected package bootstrap>', 'exec'), {'__name__':'__main__'})
          PACKAGE_BOOTSTRAP
      # The focused delivery tests import @noble/hashes and exercise tiny
      # source/physical CLI fixtures with NumPy/Shapely. Keep their real runtime.
      - run: npm ci --no-audit --no-fund
        if: needs.prepare.outputs.profile == 'full' || needs.prepare.outputs.profile == 'evidence'
      - run: python -m pip install -r requirements.txt
        if: needs.prepare.outputs.profile == 'full' || needs.prepare.outputs.profile == 'evidence'
      - name: Assemble unchanged base with current selected output
        id: assembly
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && needs.prepare.outputs.test_selection == 'selected-data'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PACKAGE_TRUSTED_BASE: ${{ needs.prepare.outputs.base }}
          SELECTED_PACKAGE_ENTRY_POINT: scripts/assemble-selected-package.mjs
          SELECTED_PACKAGE_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          INTEGRATION_PROFILE: ${{ needs.prepare.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
          INTEGRATION_TEST_SELECTION: ${{ needs.prepare.outputs.test_selection }}
        run: |
          python3 -I -S -B - <<'PACKAGE_BOOTSTRAP'
          import base64, hashlib, json, os, re, urllib.request
          base = os.environ['SELECTED_PACKAGE_TRUSTED_BASE']
          assert re.fullmatch('[a-f0-9]{40}', base)
          assert os.environ['GITHUB_REPOSITORY'] == 'ChengshuLi/WorldAtlas'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_): raise ValueError('Unexpected bootstrap redirect')
          url = 'https://api.github.com/repos/ChengshuLi/WorldAtlas/contents/scripts/selected-package-bootstrap.py?ref=' + base
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
              raw = response.read(262145)
          assert len(raw) <= 262144
          blob = json.loads(raw)
          assert blob['type'] == 'file' and blob['encoding'] == 'base64' and blob['path'] == 'scripts/selected-package-bootstrap.py'
          body = base64.b64decode(''.join(blob['content'].split()), validate=True)
          assert len(body) == blob['size'] and hashlib.sha1(('blob ' + str(len(body)) + '\0').encode() + body).hexdigest() == blob['sha']
          exec(compile(body, '<authenticated selected package bootstrap>', 'exec'), {'__name__':'__main__'})
          PACKAGE_BOOTSTRAP
      - name: Snapshot original final-worker package inputs
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && steps.assembly.outputs.assembled != 'true'
        run: node scripts/package-output-artifact.mjs --snapshot
      - name: Build the combined application once before asset-dependent tests
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && steps.assembly.outputs.assembled != 'true'
        run: npm run build:cloudflare
      - name: Inventory original final-worker package output
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && steps.assembly.outputs.assembled != 'true'
        run: node scripts/package-output-artifact.mjs
      - name: Install browser dependencies only for tests that use Playwright
        if: needs.prepare.outputs.test_selection != 'selected-data'
        env:
          INTEGRATION_PROFILE: ${{ needs.prepare.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
          INTEGRATION_TEST_SELECTION: ${{ steps.assembly.outputs.assembled == 'true' && 'selected-output' || needs.prepare.outputs.test_selection }}
          SELECTED_EXPECTATIONS_PATH: ${{ needs.prepare.outputs.expectations_path }}
        run: |
          if node --input-type=module -e "import {integrationNeedsBrowser} from './scripts/run-integration-tests.mjs'; process.exit(integrationNeedsBrowser(process.env.INTEGRATION_PROFILE, Number(process.env.INTEGRATION_SHARD), process.env.INTEGRATION_TEST_SELECTION || 'complete') ? 0 : 1)"; then
            npx playwright install --with-deps chromium
          fi
      - name: Test applicable combined-tree invariants without publishing or live imports
        env:
          INTEGRATION_PROFILE: ${{ needs.prepare.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
          INTEGRATION_TEST_SELECTION: ${{ steps.assembly.outputs.assembled == 'true' && 'selected-output' || needs.prepare.outputs.test_selection }}
          SELECTED_PACKAGE_ASSEMBLY_SHA256: ${{ steps.assembly.outputs.assembly_sha256 }}
          SELECTED_EXPECTATIONS_PATH: ${{ needs.prepare.outputs.expectations_path }}
        run: |
          if test "$INTEGRATION_TEST_SELECTION" = selected-data || test "$INTEGRATION_TEST_SELECTION" = selected-output; then
            node --input-type=module -e 'import {selectedDeliverySmoke} from "./scripts/integration-profile.mjs"; console.log(JSON.stringify({selected_delivery_smoke:await selectedDeliverySmoke(process.env.SELECTED_EXPECTATIONS_PATH)}));'
          fi
          if test "$INTEGRATION_TEST_SELECTION" = selected-output; then
            node --input-type=module -e "import {requireCurrentPackageAssembly} from './scripts/run-integration-tests.mjs'; console.log(JSON.stringify({package_assembly:requireCurrentPackageAssembly()}))"
          elif test "$INTEGRATION_TEST_SELECTION" != selected-data; then
            node scripts/run-integration-tests.mjs
          fi
      - name: Retain original final-worker package output
        if: success() && needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && steps.assembly.outputs.assembled != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-package-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/client/
            dist/cloudflare/
            .cache/package-output-manifest.json
            .cache/package-input-build.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain selected delivery smoke
        if: always() && needs.prepare.outputs.profile == 'full' && matrix.shard == 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected-delivery-smoke-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: .cache/selected-delivery-smoke.json
          include-hidden-files: true
          if-no-files-found: ignore
  merge:
    needs: [prepare, integration, geography]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      # Fresh trusted main code only; candidate code never runs in this job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Recheck tested base, ownership, reviewed bytes and checks before squash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PHASE: merge
          CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
          TESTED_BASE: ${{ needs.prepare.outputs.base }}
          TESTED_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          GEOGRAPHY_RESULT: ${{ needs.geography.result }}
          GEOGRAPHY_REPORT_SHA256: ${{ needs.geography.outputs.report_sha256 }}
          GEOGRAPHY_ARTIFACT_NAME: ${{ needs.geography.outputs.artifact_name }}
        run: node scripts/run-worker-merge.mjs
