name: Serialize worker PR merges
run-name: 'merge #${{ inputs.pr_number }} ${{ inputs.request_id }}'
on:
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        required: true
      expected_head:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions: {}
# GitHub queues up to 100 pending runs; overflow is canceled by Actions.
# Serialize the complete candidate/test/final lifecycle, with no scheduler.
concurrency:
  group: worldatlas-main-integrate
  queue: max
  cancel-in-progress: false
# The intended normal package target is Cloudflare; the separate Site gate is retained.

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Trusted preparation can create/delete only its disposable candidate branch.
      contents: write
      # GitHub requires PR write permission to post the durable preparation
      # receipt on a pull request. Only trusted main code receives this token.
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      candidate_ref: ${{ steps.prepare.outputs.candidate_ref }}
      base: ${{ steps.prepare.outputs.base }}
      profile: ${{ steps.prepare.outputs.profile }}
      geography_software: ${{ steps.prepare.outputs.geography_software }}
      geography_required: ${{ steps.prepare.outputs.geography_required }}
      shards: ${{ steps.prepare.outputs.shards }}
      test_selection: ${{ steps.prepare.outputs.test_selection }}
      expectations_path: ${{ steps.prepare.outputs.expectations_path }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: prepare
        name: Validate ready reviewed head and pin current integration candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PHASE: prepare
        run: node scripts/run-worker-merge.mjs
  geography:
    needs: prepare
    if: needs.prepare.outputs.candidate != '' && needs.prepare.outputs.geography_required != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      report_sha256: ${{ steps.check.outputs.report_sha256 }}
      artifact_name: ${{ steps.check.outputs.artifact_name }}
    steps:
      # Full software runs the exact candidate checker without credentials.
      # Selected data and source-only work retain the trusted baseline checker.
      - name: Checkout trusted geographic checker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ (needs.prepare.outputs.geography_software == 'true') && needs.prepare.outputs.candidate || needs.prepare.outputs.base }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
            coordination/engineering/selected-geography-effective-prevention-20261009
            coordination/engineering/selected-checkpoint-reuse-20261012
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact combined geography with trusted baseline code
        id: check
        env:
          GH_TOKEN: ${{ !(needs.prepare.outputs.geography_software == 'true') && github.token || '' }}
          GEOGRAPHY_PR_NUMBER: ${{ inputs.pr_number }}
          GEOGRAPHY_REVIEWED_HEAD: ${{ inputs.expected_head }}
          GEOGRAPHY_ARTIFACT_NAME: geography-${{ inputs.request_id }}-${{ github.run_attempt }}
          GEOGRAPHY_BASELINE: ${{ needs.prepare.outputs.base }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
          GEOGRAPHY_CODE_COMMIT: ${{ (needs.prepare.outputs.geography_software == 'true') && needs.prepare.outputs.candidate || needs.prepare.outputs.base }}
          GEOGRAPHY_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          python -I -B scripts/run-geographic-check.py --fetch --out geography-check.json
          echo "artifact_name=$GEOGRAPHY_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: geography-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: |
            geography-check.json
            derived-certificate.json.gz
            derived-facts.json
            derived-publication.json
            checkpoint-routes.json
            operating.json
          retention-days: 30
  integration:
    needs: prepare
    if: needs.prepare.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    permissions:
      contents: read
      actions: read
    steps:
      # Candidate code runs only in this isolated job, without write credentials,
      # repository secrets, persistent checkout authentication, or OIDC rights.
      - name: Authenticate trusted full-checkout bootstrap
        id: checkout_bootstrap
        if: needs.prepare.outputs.profile == 'full'
        env:
          WORLDATLAS_CHECKOUT_TOKEN: ${{ github.token }}
          CI_CHECKOUT_REPOSITORY: ${{ github.repository }}
          CI_CHECKOUT_BASE: ${{ needs.prepare.outputs.base }}
          CI_CHECKOUT_SHA: ${{ needs.prepare.outputs.candidate }}
          CI_CHECKOUT_PR: ''
          CI_CHECKOUT_HEAD_REF: ''
        run: |
          python3 -I -S -B - <<'CHECKOUT_BOOTSTRAP'
          import base64, hashlib, json, os, pathlib, re, signal, tempfile, time, urllib.request
          started = time.monotonic()
          signal.signal(signal.SIGALRM, lambda *_: (_ for _ in ()).throw(TimeoutError()))
          signal.setitimer(signal.ITIMER_REAL, 60)
          def need(ok):
              if not ok: raise ValueError('Invalid authenticated checkout metadata')
          def oid(value): return isinstance(value, str) and re.fullmatch('[0-9a-f]{40}', value)
          def object_hash(kind, raw): return hashlib.sha1((kind + ' ' + str(len(raw)) + '\0').encode() + raw).hexdigest()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_): raise ValueError('API redirects are not checkout authority')
          try:
              repo, base, candidate = (os.environ[key] for key in ('CI_CHECKOUT_REPOSITORY', 'CI_CHECKOUT_BASE', 'CI_CHECKOUT_SHA'))
              token = os.environ['WORLDATLAS_CHECKOUT_TOKEN']
              need(repo == 'ChengshuLi/WorldAtlas' and oid(base) and oid(candidate) and bool(token))
              consumed = 0
              opener = urllib.request.build_opener(NoRedirect())
              def api(route):
                  global consumed
                  remaining = 60 - (time.monotonic() - started)
                  need(remaining > 0)
                  request = urllib.request.Request('https://api.github.com/repos/' + repo + route,
                      headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
                  with opener.open(request, timeout=min(20, remaining)) as response:
                      need(response.status == 200)
                      raw = response.read(2 * 1024 * 1024 + 1)
                  consumed += len(raw)
                  need(len(raw) <= 2 * 1024 * 1024 and consumed <= 8 * 1024 * 1024)
                  value = json.loads(raw)
                  need(isinstance(value, dict))
                  return value
              number = os.environ.get('CI_CHECKOUT_PR', '')
              if number:
                  need(re.fullmatch('[1-9][0-9]*', number))
                  pr = api('/pulls/' + number)
                  need(pr.get('number') == int(number) and pr.get('state') == 'open'
                      and oid(pr['base']['sha']) and pr['base']['ref'] == 'main' and pr['base']['repo']['full_name'] == repo
                      and pr['head']['sha'] == candidate and pr['head']['repo']['full_name'] == repo
                      and pr['head']['ref'] == os.environ['CI_CHECKOUT_HEAD_REF'])
              def commit(sha):
                  value = api('/git/commits/' + sha)
                  need(value.get('sha') == sha and oid(value.get('tree', {}).get('sha')))
                  return value['tree']['sha']
              candidate_tree, base_tree = commit(candidate), commit(base)
              def tree(sha):
                  value = api('/git/trees/' + sha)
                  need(value.get('sha') == sha and value.get('truncated') is False and isinstance(value.get('tree'), list))
                  entries, raw = {}, []
                  kinds = {'040000': 'tree', '100644': 'blob', '100755': 'blob', '120000': 'blob', '160000': 'commit'}
                  for row in value['tree']:
                      name, mode, kind, child = (row.get(key) for key in ('path', 'mode', 'type', 'sha'))
                      need(isinstance(name, str) and name not in ('', '.', '..') and '/' not in name and '\0' not in name
                          and name not in entries and mode in kinds and kind == kinds[mode] and oid(child))
                      encoded = name.encode('utf-8')
                      entries[name] = row
                      raw.append((encoded + (b'/' if kind == 'tree' else b'\0'), mode.lstrip('0').encode() + b' ' + encoded + b'\0' + bytes.fromhex(child)))
                  need(object_hash('tree', b''.join(body for _, body in sorted(raw))) == sha)
                  return entries
              scripts = tree(base_tree).get('scripts')
              helper = None
              if scripts is not None:
                  need(scripts['mode'] == '040000' and scripts['type'] == 'tree')
                  helper = tree(scripts['sha']).get('acquire-ci-checkout.py')
              mode, helper_path = 'legacy', ''
              if helper is not None:
                  need(helper['mode'] == '100644' and helper['type'] == 'blob')
                  blob = api('/git/blobs/' + helper['sha'])
                  need(blob.get('sha') == helper['sha'] and blob.get('encoding') == 'base64'
                      and type(blob.get('size')) is int and 0 < blob['size'] <= 262144 and isinstance(blob.get('content'), str))
                  raw = base64.b64decode(''.join(blob['content'].split()), validate=True)
                  need(len(raw) == blob['size'] and object_hash('blob', raw) == helper['sha'])
                  root = pathlib.Path(os.environ['RUNNER_TEMP'])
                  need(root.is_dir() and not root.is_symlink() and str(root.resolve()) == str(root) and '\n' not in str(root))
                  directory = pathlib.Path(tempfile.mkdtemp(prefix='worldatlas-checkout-bootstrap-', dir=root))
                  helper_path = str(directory / 'acquire-ci-checkout.py')
                  with open(helper_path, 'xb') as output:
                      output.write(raw); output.flush(); os.fsync(output.fileno())
                  mode = 'helper'
              # Measure after the authenticated helper has actually reached durable disk.
              elapsed = time.monotonic() - started
              need(0 <= elapsed < 60)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(f'mode={mode}\nhelper={helper_path}\nsha={candidate}\ntree={candidate_tree}\nelapsed={elapsed:.6f}\n')
          except Exception:
              raise SystemExit('Trusted checkout bootstrap failed; no legacy fallback authorized')
          finally:
              signal.setitimer(signal.ITIMER_REAL, 0)
          CHECKOUT_BOOTSTRAP
      - name: Acquire full checkout with authenticated bounded helper
        if: (needs.prepare.outputs.profile == 'full') && steps.checkout_bootstrap.outputs.mode == 'helper'
        env:
          WORLDATLAS_CHECKOUT_TOKEN: ${{ github.token }}
          CI_CHECKOUT_HELPER: ${{ steps.checkout_bootstrap.outputs.helper }}
          CI_CHECKOUT_SHA: ${{ steps.checkout_bootstrap.outputs.sha }}
          CI_CHECKOUT_TREE: ${{ steps.checkout_bootstrap.outputs.tree }}
          INTEGRATION_PROFILE: ${{ needs.prepare.outputs.profile }}
          INTEGRATION_TEST_SELECTION: ${{ needs.prepare.outputs.test_selection }}
          SELECTED_EXPECTATIONS_PATH: ${{ needs.prepare.outputs.expectations_path }}
        run: |
          python3 -I -S -B "$CI_CHECKOUT_HELPER" --repository ChengshuLi/WorldAtlas \
            --sha "$CI_CHECKOUT_SHA" --tree "$CI_CHECKOUT_TREE" --workspace "$GITHUB_WORKSPACE"
      - name: Legacy full checkout only for proven trusted-helper absence
        if: (needs.prepare.outputs.profile == 'full') && steps.checkout_bootstrap.outputs.mode == 'legacy'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.checkout_bootstrap.outputs.sha }}
          persist-credentials: false
      - name: Checkout complete candidate for application regression
        if: needs.prepare.outputs.profile == 'full'
        env:
          CI_CHECKOUT_REPOSITORY: ${{ github.repository }}
          CI_CHECKOUT_SHA: ${{ steps.checkout_bootstrap.outputs.sha }}
          CI_CHECKOUT_TREE: ${{ steps.checkout_bootstrap.outputs.tree }}
        run: |
          python3 -I -S -B - <<'CHECKOUT_VERIFY'
          import os, re, subprocess, urllib.parse
          sha, tree, repo = (os.environ[key] for key in ('CI_CHECKOUT_SHA', 'CI_CHECKOUT_TREE', 'CI_CHECKOUT_REPOSITORY'))
          assert re.fullmatch('[0-9a-f]{40}', sha) and re.fullmatch('[0-9a-f]{40}', tree) and repo == 'ChengshuLi/WorldAtlas'
          assert not any(os.environ.get(key) for key in ('WORLDATLAS_CHECKOUT_TOKEN', 'GH_TOKEN', 'GITHUB_TOKEN'))
          env = dict(os.environ, GIT_NO_LAZY_FETCH='1', GIT_TERMINAL_PROMPT='0')
          def git(*args): return subprocess.check_output(['git', *args], env=env, timeout=20).decode().strip()
          assert git('rev-parse', '--verify', 'HEAD') == sha and git('rev-parse', '--verify', 'HEAD^{tree}') == tree
          assert subprocess.run(['git', 'symbolic-ref', '-q', 'HEAD'], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20).returncode == 1
          for item in git('config', '--local', '--null', '--list').split('\0'):
              if not item: continue
              key, _, value = item.partition('\n')
              assert 'extraheader' not in key.lower() and not key.lower().startswith(('credential.', 'url.'))
              if key.startswith('remote.') and key.endswith(('.url', '.pushurl')):
                  assert value in ('https://github.com/' + repo, 'https://github.com/' + repo + '.git')
          print('Exact detached candidate commit/tree verified; checkout credentials absent')
          CHECKOUT_VERIFY
      - name: Checkout only focused-test inputs for evidence regression
        if: needs.prepare.outputs.profile == 'evidence'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            src
            test
            .github
            drizzle
            hosted
            coordination/engineering/selected-geography-effective-prevention-20261009
            coordination/engineering/additive-native-gap-batch-20261008/composition-v2/compose-retained.mjs
            coordination/engineering/native-grid-fidelity-1010-20261005-local15/results-v1/native-row-latitudes.f64le.gz
            coordination/engineering/coverage-gaps-907-20261005-local01/sources/natural-earth-lakes.geojson.gz
            docs/LOCAL_WORKSPACES.md
            coordination/engineering/selected-checkpoint-reuse-20261012/accepted-checkpoints.json
            data/research-geography-gate.json
            package.json
            package-lock.json
            requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate selected package installer inputs
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && needs.prepare.outputs.test_selection == 'selected-data'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PACKAGE_TRUSTED_BASE: ${{ needs.prepare.outputs.base }}
          SELECTED_PACKAGE_ENTRY_POINT: scripts/assemble-selected-package.mjs
          SELECTED_PACKAGE_PREFLIGHT: install
        run: |
          python3 -I -S -B - <<'PACKAGE_BOOTSTRAP'
          import base64, hashlib, json, os, re, urllib.request
          base = os.environ['SELECTED_PACKAGE_TRUSTED_BASE']
          assert re.fullmatch('[a-f0-9]{40}', base)
          assert os.environ['GITHUB_REPOSITORY'] == 'ChengshuLi/WorldAtlas'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_): raise ValueError('Unexpected bootstrap redirect')
          url = 'https://api.github.com/repos/ChengshuLi/WorldAtlas/contents/scripts/selected-package-bootstrap.py?ref=' + base
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
              raw = response.read(262145)
          assert len(raw) <= 262144
          blob = json.loads(raw)
          assert blob['type'] == 'file' and blob['encoding'] == 'base64' and blob['path'] == 'scripts/selected-package-bootstrap.py'
          body = base64.b64decode(''.join(blob['content'].split()), validate=True)
          assert len(body) == blob['size'] and hashlib.sha1(('blob ' + str(len(body)) + '\0').encode() + body).hexdigest() == blob['sha']
          exec(compile(body, '<authenticated selected package bootstrap>', 'exec'), {'__name__':'__main__'})
          PACKAGE_BOOTSTRAP
      # The focused delivery tests import @noble/hashes and exercise tiny
      # source/physical CLI fixtures with NumPy/Shapely. Keep their real runtime.
      - run: npm ci --no-audit --no-fund
        if: needs.prepare.outputs.profile == 'full' || needs.prepare.outputs.profile == 'evidence'
      - run: python -m pip install -r requirements.txt
        if: needs.prepare.outputs.profile == 'full' || needs.prepare.outputs.profile == 'evidence'
      - name: Assemble unchanged base with current selected output
        id: assembly
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && needs.prepare.outputs.test_selection == 'selected-data'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PACKAGE_TRUSTED_BASE: ${{ needs.prepare.outputs.base }}
          SELECTED_PACKAGE_ENTRY_POINT: scripts/assemble-selected-package.mjs
          SELECTED_PACKAGE_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          INTEGRATION_PROFILE: ${{ needs.prepare.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
          INTEGRATION_TEST_SELECTION: ${{ needs.prepare.outputs.test_selection }}
        run: |
          python3 -I -S -B - <<'PACKAGE_BOOTSTRAP'
          import base64, hashlib, json, os, re, urllib.request
          base = os.environ['SELECTED_PACKAGE_TRUSTED_BASE']
          assert re.fullmatch('[a-f0-9]{40}', base)
          assert os.environ['GITHUB_REPOSITORY'] == 'ChengshuLi/WorldAtlas'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *_): raise ValueError('Unexpected bootstrap redirect')
          url = 'https://api.github.com/repos/ChengshuLi/WorldAtlas/contents/scripts/selected-package-bootstrap.py?ref=' + base
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
              raw = response.read(262145)
          assert len(raw) <= 262144
          blob = json.loads(raw)
          assert blob['type'] == 'file' and blob['encoding'] == 'base64' and blob['path'] == 'scripts/selected-package-bootstrap.py'
          body = base64.b64decode(''.join(blob['content'].split()), validate=True)
          assert len(body) == blob['size'] and hashlib.sha1(('blob ' + str(len(body)) + '\0').encode() + body).hexdigest() == blob['sha']
          exec(compile(body, '<authenticated selected package bootstrap>', 'exec'), {'__name__':'__main__'})
          PACKAGE_BOOTSTRAP
      - name: Snapshot original final-worker package inputs
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && steps.assembly.outputs.assembled != 'true'
        run: node scripts/package-output-artifact.mjs --snapshot
      - name: Build the combined application once before asset-dependent tests
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && steps.assembly.outputs.assembled != 'true'
        run: npm run build:cloudflare
      - name: Inventory original final-worker package output
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && steps.assembly.outputs.assembled != 'true'
        run: node scripts/package-output-artifact.mjs
      - name: Install browser dependencies only for tests that use Playwright
        if: needs.prepare.outputs.test_selection != 'selected-data'
        env:
          INTEGRATION_PROFILE: ${{ needs.prepare.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
          INTEGRATION_TEST_SELECTION: ${{ steps.assembly.outputs.assembled == 'true' && 'selected-output' || needs.prepare.outputs.test_selection }}
          SELECTED_EXPECTATIONS_PATH: ${{ needs.prepare.outputs.expectations_path }}
        run: |
          if node --input-type=module -e "import {integrationNeedsBrowser} from './scripts/run-integration-tests.mjs'; process.exit(integrationNeedsBrowser(process.env.INTEGRATION_PROFILE, Number(process.env.INTEGRATION_SHARD), process.env.INTEGRATION_TEST_SELECTION || 'complete') ? 0 : 1)"; then
            npx playwright install --with-deps chromium
          fi
      - name: Test applicable combined-tree invariants without publishing or live imports
        env:
          INTEGRATION_PROFILE: ${{ needs.prepare.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
          INTEGRATION_TEST_SELECTION: ${{ steps.assembly.outputs.assembled == 'true' && 'selected-output' || needs.prepare.outputs.test_selection }}
          SELECTED_PACKAGE_ASSEMBLY_SHA256: ${{ steps.assembly.outputs.assembly_sha256 }}
          SELECTED_EXPECTATIONS_PATH: ${{ needs.prepare.outputs.expectations_path }}
        run: |
          if test "$INTEGRATION_TEST_SELECTION" = selected-data || test "$INTEGRATION_TEST_SELECTION" = selected-output; then
            node --input-type=module -e 'import {selectedDeliverySmoke} from "./scripts/integration-profile.mjs"; console.log(JSON.stringify({selected_delivery_smoke:await selectedDeliverySmoke(process.env.SELECTED_EXPECTATIONS_PATH)}));'
          fi
          if test "$INTEGRATION_TEST_SELECTION" = selected-output; then
            node --input-type=module -e "import {requireCurrentPackageAssembly} from './scripts/run-integration-tests.mjs'; console.log(JSON.stringify({package_assembly:requireCurrentPackageAssembly()}))"
          elif test "$INTEGRATION_TEST_SELECTION" != selected-data; then
            node scripts/run-integration-tests.mjs
          fi
      - name: Retain original final-worker package output
        if: success() && needs.prepare.outputs.profile == 'full' && matrix.shard == 0 && steps.assembly.outputs.assembled != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-package-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/client/
            dist/cloudflare/
            .cache/package-output-manifest.json
            .cache/package-input-build.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain selected delivery smoke
        if: always() && needs.prepare.outputs.profile == 'full' && matrix.shard == 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected-delivery-smoke-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: .cache/selected-delivery-smoke.json
          include-hidden-files: true
          if-no-files-found: ignore
  merge:
    needs: [prepare, integration, geography]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      # Fresh trusted main code only; candidate code never runs in this job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Recheck tested base, ownership, reviewed bytes and checks before squash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PHASE: merge
          CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
          TESTED_BASE: ${{ needs.prepare.outputs.base }}
          TESTED_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          GEOGRAPHY_RESULT: ${{ needs.geography.result }}
