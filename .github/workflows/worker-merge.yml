name: Serialize worker PR merges
run-name: 'merge #${{ inputs.pr_number }} ${{ inputs.request_id }}'
on:
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        required: true
      expected_head:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions: {}
# GitHub queues up to 100 pending runs; overflow is canceled by Actions.
# Serialize the complete candidate/test/final lifecycle, with no scheduler.
concurrency:
  group: worldatlas-main-integrate
  queue: max
  cancel-in-progress: false
# The intended normal package target is Cloudflare; the separate Site gate is retained.

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Trusted preparation can create/delete only its disposable candidate branch.
      contents: write
      # GitHub requires PR write permission to post the durable preparation
      # receipt on a pull request. Only trusted main code receives this token.
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      candidate_ref: ${{ steps.prepare.outputs.candidate_ref }}
      base: ${{ steps.prepare.outputs.base }}
      profile: ${{ steps.prepare.outputs.profile }}
      geography_software: ${{ steps.prepare.outputs.geography_software }}
      geography_required: ${{ steps.prepare.outputs.geography_required }}
      shards: ${{ steps.prepare.outputs.shards }}
      test_selection: ${{ steps.prepare.outputs.test_selection }}
      expectations_path: ${{ steps.prepare.outputs.expectations_path }}
      candidate_tree: ${{ steps.prepare.outputs.candidate_tree }}
      checkout_patterns: ${{ steps.prepare.outputs.checkout_patterns }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: prepare
        name: Validate ready reviewed head and pin current integration candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PHASE: prepare
        run: node scripts/run-worker-merge.mjs
  geography:
    needs: prepare
    if: needs.prepare.outputs.candidate != '' && needs.prepare.outputs.geography_required != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      report_sha256: ${{ steps.check.outputs.report_sha256 }}
      artifact_name: ${{ steps.check.outputs.artifact_name }}
    steps:
      # Full software runs the exact candidate checker without credentials.
      # Selected data and source-only work retain the trusted baseline checker.
      - name: Checkout trusted geographic checker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ (needs.prepare.outputs.geography_software == 'true') && needs.prepare.outputs.candidate || needs.prepare.outputs.base }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
            coordination/engineering/selected-geography-effective-prevention-20261009
            coordination/engineering/selected-checkpoint-reuse-20261012
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact combined geography with trusted baseline code
        id: check
        env:
          GH_TOKEN: ${{ !(needs.prepare.outputs.geography_software == 'true') && github.token || '' }}
          GEOGRAPHY_PR_NUMBER: ${{ inputs.pr_number }}
          GEOGRAPHY_REVIEWED_HEAD: ${{ inputs.expected_head }}
          GEOGRAPHY_ARTIFACT_NAME: geography-${{ inputs.request_id }}-${{ github.run_attempt }}
          GEOGRAPHY_BASELINE: ${{ needs.prepare.outputs.base }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
          GEOGRAPHY_CODE_COMMIT: ${{ (needs.prepare.outputs.geography_software == 'true') && needs.prepare.outputs.candidate || needs.prepare.outputs.base }}
          GEOGRAPHY_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          python -I -B scripts/run-geographic-check.py --fetch --out geography-check.json
          echo "artifact_name=$GEOGRAPHY_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: geography-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: |
            geography-check.json
            derived-certificate.json.gz
            derived-facts.json
            derived-publication.json
            checkpoint-routes.json
            operating.json
          retention-days: 30
  integration:
    needs: prepare
    if: needs.prepare.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    permissions:
      contents: read
      actions: read
    steps:
      # Candidate code runs only in this isolated job, without write credentials,
      # repository secrets, persistent checkout authentication, or OIDC rights.
      - name: Checkout exact candidate for application regression
        if: needs.prepare.outputs.profile == 'full'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ needs.prepare.outputs.checkout_patterns }}
          lfs: false
          submodules: false
          set-safe-directory: false
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: ''
      - name: Checkout complete candidate for application regression
        if: needs.prepare.outputs.profile == 'full'
        env:
          CI_CHECKOUT_REPOSITORY: ${{ github.repository }}
          CI_CHECKOUT_SHA: ${{ needs.prepare.outputs.candidate }}
          CI_CHECKOUT_TREE: ${{ needs.prepare.outputs.candidate_tree }}
        run: |
          python3 -I -S -B - <<'CHECKOUT_VERIFY'
          import os, re, subprocess, urllib.parse
          sha, tree, repo = (os.environ[key] for key in ('CI_CHECKOUT_SHA', 'CI_CHECKOUT_TREE', 'CI_CHECKOUT_REPOSITORY'))
          assert re.fullmatch('[0-9a-f]{40}', sha) and re.fullmatch('[0-9a-f]{40}', tree) and repo == 'ChengshuLi/WorldAtlas'
          assert not any(os.environ.get(key) for key in ('WORLDATLAS_CHECKOUT_TOKEN', 'GH_TOKEN', 'GITHUB_TOKEN', 'INPUT_TOKEN'))
          env = dict(os.environ, GIT_NO_LAZY_FETCH='1', GIT_TERMINAL_PROMPT='0')
          def git(*args): return subprocess.check_output(['git', *args], env=env, timeout=20).decode().strip()
          assert git('rev-parse', '--verify', 'HEAD') == sha and git('rev-parse', '--verify', 'HEAD^{tree}') == tree
          assert subprocess.run(['git', 'symbolic-ref', '-q', 'HEAD'], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20).returncode == 1
          for item in git('config', '--local', '--null', '--list').split('\0'):
              if not item: continue
              key, _, value = item.partition('\n')
              assert 'extraheader' not in key.lower() and not key.lower().startswith(('credential.', 'url.', 'include'))
              if key.startswith('remote.') and key.endswith(('.url', '.pushurl')):
                  assert value in ('https://github.com/' + repo, 'https://github.com/' + repo + '.git')
          temporary = os.environ.get('RUNNER_TEMP')
          if temporary:
              import pathlib
              assert not list(pathlib.Path(temporary).glob('git-credentials-*.config'))
          subprocess.run(['git', 'config', '--local', 'remote.origin.promisor', 'false'], env=env, check=True, timeout=20)
          result = subprocess.run(['git', 'config', '--local', '--unset-all', 'remote.origin.partialclonefilter'], env=env, timeout=20)
          assert result.returncode in (0, 5)
          print('Exact detached candidate commit/tree verified; checkout credentials absent')
          CHECKOUT_VERIFY
      # Include the original retained delivery specimens read by the classifier tests.
      - name: Checkout only focused-test inputs for evidence regression
        if: needs.prepare.outputs.profile == 'evidence'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
