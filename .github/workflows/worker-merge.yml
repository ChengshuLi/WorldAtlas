name: Serialize worker PR merges
run-name: 'merge #${{ inputs.pr_number }} ${{ inputs.request_id }} attempt ${{ inputs.queue_attempt }}'
on:
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        required: true
      expected_head:
        type: string
        required: true
      request_id:
        type: string
        required: true
      queue_attempt:
        type: string
        required: true
permissions: {}
# Hold main for the admitted request's complete candidate/test/final lifecycle.
# Durable FIFO registrations live outside this group, so replaced pending runs
# are recovered by the scheduler rather than discarded.
concurrency:
  group: worldatlas-main-integrate
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Trusted preparation can create/delete only its disposable candidate branch.
      contents: write
      # GitHub requires PR write permission to post the durable preparation
      # receipt on a pull request. Only trusted main code receives this token.
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      candidate_ref: ${{ steps.prepare.outputs.candidate_ref }}
      base: ${{ steps.prepare.outputs.base }}
      profile: ${{ steps.prepare.outputs.profile }}
      shards: ${{ steps.prepare.outputs.shards }}
      proof_attempt: ${{ steps.prepare.outputs.proof_attempt }}
      proof_run: ${{ steps.prepare.outputs.proof_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: prepare
        name: Validate ready reviewed head and pin current integration candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_FALLBACK: 'true'
          QUEUE_ADMISSION: 'required'
          MERGE_PHASE: prepare
        run: node scripts/run-worker-merge.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merge-preflight-${{ inputs.request_id }}
          path: merge-result.json
          retention-days: 30
  geography:
    needs: prepare
    if: needs.prepare.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      report_sha256: ${{ steps.check.outputs.report_sha256 }}
      artifact_name: ${{ steps.check.outputs.artifact_name }}
    steps:
      # Trusted baseline code reads candidate blobs; candidate code never runs.
      - name: Checkout trusted geographic checker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
            coordination/engineering/selected-geography-effective-prevention-20261009
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install trusted geographic dependencies
        run: python -m pip install -r requirements.txt
      - name: Check exact combined geography with trusted baseline code
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GEOGRAPHY_PR_NUMBER: ${{ inputs.pr_number }}
          GEOGRAPHY_REVIEWED_HEAD: ${{ inputs.expected_head }}
          GEOGRAPHY_ARTIFACT_NAME: geography-${{ inputs.request_id }}-${{ github.run_attempt }}
          GEOGRAPHY_BASELINE: ${{ needs.prepare.outputs.base }}
          GEOGRAPHY_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          python -I -B scripts/run-geographic-check.py --fetch --out geography-check.json
          echo "artifact_name=$GEOGRAPHY_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: geography-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: geography-check.json
          retention-days: 30
  integration:
    needs: prepare
    if: needs.prepare.outputs.candidate != '' && needs.prepare.outputs.proof_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    permissions:
      contents: read
    steps:
      # Candidate code runs only in this isolated job, without write credentials,
      # repository secrets, persistent checkout authentication, or OIDC rights.
      - name: Checkout complete candidate for application regression
        if: needs.prepare.outputs.profile == 'full'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - name: Checkout only focused-test inputs for evidence regression
        if: needs.prepare.outputs.profile == 'evidence'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            src
            test
            .github
            drizzle
            hosted
            data/research-geography-gate.json
            package.json
            package-lock.json
            requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        if: needs.prepare.outputs.profile == 'full'
      - run: python -m pip install -r requirements.txt
        if: needs.prepare.outputs.profile == 'full'
      - name: Install browser dependencies only for tests that use Playwright
        env:
          INTEGRATION_PROFILE: ${{ needs.prepare.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: |
          if node --input-type=module -e "import {integrationNeedsBrowser} from './scripts/run-integration-tests.mjs'; process.exit(integrationNeedsBrowser(process.env.INTEGRATION_PROFILE, Number(process.env.INTEGRATION_SHARD)) ? 0 : 1)"; then
            npx playwright install --with-deps chromium
          fi
      - name: Build the combined application once before asset-dependent tests
        if: needs.prepare.outputs.profile == 'full' && matrix.shard == 0
        run: npm run build:hosted
      - name: Test applicable combined-tree invariants without publishing or live imports
        env:
          INTEGRATION_PROFILE: ${{ needs.prepare.outputs.profile }}
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: node scripts/run-integration-tests.mjs
  merge:
    needs: [prepare, integration, geography]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      # Fresh trusted main code only; candidate code never runs in this job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
            .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Recheck tested base, ownership, reviewed bytes and checks before squash
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_ADMISSION: 'required'
          MERGE_PHASE: merge
          FINAL_CAPACITY: 'required'
          CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
          TESTED_BASE: ${{ needs.prepare.outputs.base }}
          TESTED_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          PROOF_RUN_ATTEMPT: ${{ needs.prepare.outputs.proof_attempt }}
          PROOF_RUN_ID: ${{ needs.prepare.outputs.proof_run }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          GEOGRAPHY_RESULT: ${{ needs.geography.result }}
          GEOGRAPHY_REPORT_SHA256: ${{ needs.geography.outputs.report_sha256 }}
          GEOGRAPHY_ARTIFACT_NAME: ${{ needs.geography.outputs.artifact_name }}
        run: node scripts/run-worker-merge.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merge-${{ inputs.request_id }}
          path: merge-result.json
          retention-days: 30
