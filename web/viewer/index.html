<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldAtlas</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><h1>WorldAtlas</h1><p>W / A / S / D: pan · + / −: zoom</p><p>Tab: recenter to World <span>(while the map is focused)</span></p></div><div class="identity"><span id="map-release" class="digest-label">Loading map…</span><div class="credits"><a href="sources.html">Data sources</a></div></div></header>
<main id="map"><canvas id="canvas" tabindex="0" aria-label="World assignment map. Click to select a cell."></canvas><div class="tools"><button id="tool-in" aria-label="Zoom in">+</button><button id="tool-out" aria-label="Zoom out">−</button><button id="tool-world">World</button></div>
<div class="legend-dock"><button id="legend-toggle" class="legend-toggle" type="button" aria-expanded="false" aria-controls="legend-panel" hidden>Legend</button><section id="legend-panel" class="legend-panel" aria-label="Map legend"><div class="legend-head"><label class="visually-hidden" for="legend-search">Search continents</label><input id="legend-search" type="search" placeholder="Search continents…" autocomplete="off"><button id="legend-clear" type="button" hidden>Clear filter</button><button id="legend-collapse" type="button" aria-label="Collapse legend" title="Collapse legend">⌄</button></div><div id="legend-list" class="legend-list" role="group" aria-label="Continents"></div></section></div>
<div id="selection" class="selection" role="status">Click a cell to select it.</div><div id="status" class="status" role="status">Loading map…</div></main><script type="module" src="app.js"></script></body></html>
